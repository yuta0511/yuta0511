<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="divider">
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".5"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A855F7" stop-opacity="0"/><stop offset=".6" stop-color="#22D3EE"/><stop offset="1" stop-color="#fff"/>
  </linearGradient>
  <filter id="gl" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
  .run { animation: run 3.2s cubic-bezier(.6,0,.4,1) infinite; }
  .run2 { animation: run2 3.2s cubic-bezier(.6,0,.4,1) 1.6s infinite; }
  @keyframes run { from { transform: translateX(-240px); } to { transform: translateX(1200px); } }
  @keyframes run2 { from { transform: translateX(1200px) scaleX(-1); } to { transform: translateX(-240px) scaleX(-1); } }
  .dot { animation: bl 2.4s ease-in-out infinite; }
  @keyframes bl { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
</style>
<rect x="0" y="13.25" width="1200" height="1.5" fill="url(#base)"/>
<g class="run"><rect y="12.0" width="240" height="4" rx="2" fill="url(#pulse)" filter="url(#gl)"/><rect y="13.0" width="240" height="2" rx="1" fill="url(#pulse)"/></g>
<g class="run2"><rect x="-240" y="13.0" width="240" height="2" rx="1" fill="url(#pulse)" opacity=".7"/></g>
<rect class="dot" x="595.0" y="9.0" width="10" height="10" fill="#A855F7" transform="rotate(45 600.0 14.0)"/>
</svg>
