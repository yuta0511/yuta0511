  @keyframes show { to { opacity: 1; } }
  @keyframes pulse { 0%,100% { filter: drop-shadow(0 0 4px #22D3EE); } 50% { filter: drop-shadow(0 0 18px #A855F7); } }
  .glitch { opacity: 0; animation: glitch 5s steps(1) 3s infinite; }
  .gc { fill: #22D3EE; } .gp { fill: #A855F7; }
  @keyframes glitch {
    0%,100% { opacity: 0; transform: translate(0,0); }
    92% { opacity: .7; transform: translate(-6px,2px); }
    94% { opacity: .7; transform: translate(5px,-3px); }
    96% { opacity: 0; }
  }
  .sub { font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 6px; fill: #C9D1D9; opacity: 0; animation: show 1s ease-out 2.6s forwards; }
  .caret { fill: #22D3EE; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sweep { animation: sweep 5s ease-in-out 3s infinite; }
  @keyframes sweep { 0% { transform: translateX(-400px); } 40%,100% { transform: translateX(1600px); } }
  .ring { fill: none; stroke: url(#g); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; opacity: .35; }
  .r1 { animation: spin 24s linear infinite; } .r2 { animation: spin 36s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
